        <style>
    :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-color: #f8fafc;
        --accent-color: #38bdf8;
        --secondary-text: #94a3b8;
    }

    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        direction: rtl;
        line-height: 1.6;
    }

    header {
        text-align: center;
        padding: 60px 20px;
        background: linear-gradient(to bottom, #1e293b, #0f172a);
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    header h1 {
        margin: 0;
        font-size: 2.5rem;
        color: var(--accent-color);
        text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    header p {
        color: var(--secondary-text);
        font-size: 1.1rem;
        margin-top: 10px;
    }

    .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 25px;
    }

    .card {
        background: var(--card-bg);
        border-radius: 16px;
        padding: 25px;
        border: 1px solid rgba(255,255,255,0.05);
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
    }

    .card:hover {
        transform: translateY(-10px);
        border-color: var(--accent-color);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .card h3 {
        margin: 0 0 10px 0;
        font-size: 1.4rem;
        color: var(--accent-color);
    }

    .card p {
        color: var(--secondary-text);
        font-size: 0.95rem;
        margin-bottom: 20px;
    }

    .btn {
        display: inline-block;
        background: var(--accent-color);
        color: #0f172a;
        text-decoration: none;
        padding: 12px 25px;
        border-radius: 8px;
        font-weight: bold;
        text-align: center;
        transition: opacity 0.3s;
    }

    .btn:hover {
        opacity: 0.9;
    }

    footer {
        text-align: center;
        padding: 40px;
        color: #475569;
        font-size: 0.9rem;
        border-top: 1px solid rgba(255,255,255,0.05);
    }
</style>
    
</head>
<body>

        </div>

            </div>
            <a href="https://saifmostfa2010143-tech.github.io/Ninga_game" class="btn">العب الآن</a>
        </div>
    </div>

    <footer>تم التطوير بواسطة سيف باستخدام الذكاء الاصطناعي &copy; 2026</footer>

</body>
